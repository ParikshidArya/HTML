<!DOCTYPE html>
<html>
    <head>
        <title> Hyperlink </title>
        <!--
        A digital reference to data which users can follow by clicking on a link
        -->
        
    </head>
    <body>
        <h1> Hyperlinks! </h1>
        <hr>
        <br>

        <!-- Hyperlink tag with a href, that references a website if you paste its url there. 
         Target makes you open in a new page or not. 
         Title shows text when you hover over-->
        <a href="https://www.youtube.com/watch?v=df48tnnLyzg"  
        target ="_blank"
        title = "Goes to Youtube">
            Click me!!! 
        </a>

        <br>
        <hr>
        
        <!--
        You can link other .html files to your href
        -->
        <a href = "lyrics.html">
            song lyrics
        </a>

        <br>
        <hr>

        <a href="mailto:test@fake.com">
            email me
        </a>

    </body>
</html>
